<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b70">
  <link rel="manifest" href="/app/manifest.json">
  <link rel="icon" href="/app/icon.svg" type="image/svg+xml">
  <title>Acceso | AlucarpinSamitier</title>
  <style>
    :root {
      --bg-dark: #0f1f23;
      --bg-mid: #153d42;
      --brand: #1e8a8d;
      --brand-strong: #0f6a6e;
      --accent: #f28b42;
      --accent-dark: #d86d25;
      --surface: #ffffff;
      --text: #1a2c31;
      --muted: #4d676d;
      --border: rgba(19, 67, 74, 0.18);
      --shadow: rgba(10, 27, 30, 0.22);
      font-family: Segoe UI, sans-serif;
      color: var(--text);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #2d5b60 0%, var(--bg-dark) 44%, #081b1d 100%);
      padding: 24px;
    }
    main {
      width: min(420px, 100%);
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(247,249,249,0.98));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 26px 24px 22px;
      box-shadow: 0 18px 42px var(--shadow);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px 18px;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(19, 67, 74, 0.12);
    }
    .brand-badge {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-strong) 100%);
      box-shadow: 0 10px 18px rgba(20, 110, 115, 0.35);
    }
    .brand-badge img { width: 30px; height: 30px; }
    .brand-text {
      line-height: 1.05;
      color: var(--brand-strong);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .brand-text small {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: none;
      margin-top: 3px;
      font-weight: 700;
    }
    h1 {
      margin: 10px 0 18px;
      color: var(--brand-strong);
      font-size: clamp(1.7rem, 4vw, 2.25rem);
      line-height: 1.2;
    }
    label {
      display: grid;
      gap: 8px;
      margin-top: 16px;
      font-weight: 700;
      color: var(--text);
    }
    .recordar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      font-weight: 600;
      color: var(--muted);
    }
    .recordar input { width: auto; min-height: auto; accent-color: var(--brand); }
    input, button { width: 100%; min-height: 50px; border-radius: 12px; font: inherit; }
    input {
      border: 1px solid rgba(19, 67, 74, 0.24);
      background: rgba(255,255,255,0.9);
      padding: 12px 14px;
      color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(30,138,141,0.12);
    }
    button {
      margin-top: 20px;
      border: 0;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      color: #fff;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 12px 18px rgba(242, 139, 66, 0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover { transform: translateY(-1px); }
    #mensaje {
      min-height: 26px;
      margin-top: 12px;
      font-weight: 700;
      color: #9d2d2d;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-label="Logo de AlucarpinSamitier">
      <div class="brand-badge"><img src="/app/icon.svg" alt="Logo de AlucarpinSamitier"></div>
      <div class="brand-text">Alucarpin<small>Samitier</small></div>
    </div>
    <h1>Acceso a la aplicación</h1>
    <form id="login">
      <label>Usuario <input id="usuario" autocomplete="username" required></label>
      <label>Contraseña <input id="password" type="password" autocomplete="current-password" required></label>
      <label class="recordar"><input id="recordar" type="checkbox"> Recordar usuario y contraseña</label>
      <button type="submit">Entrar</button>
      <div id="mensaje" role="alert"></div>
    </form>
  </main>
  <script>
    const formulario = document.querySelector('#login');
    const mensaje = document.querySelector('#mensaje');
    const usuario = document.querySelector('#usuario');
    const password = document.querySelector('#password');
    const recordar = document.querySelector('#recordar');
    const credencialesGuardadas = localStorage.getItem('alucarpin_credenciales');
    if (credencialesGuardadas) {
      try {
        const credenciales = JSON.parse(credencialesGuardadas);
        usuario.value = credenciales.usuario || '';
        password.value = credenciales.password || '';
        recordar.checked = Boolean(credenciales.usuario || credenciales.password);
      } catch {
        localStorage.removeItem('alucarpin_credenciales');
      }
    }
    formulario.addEventListener('submit', async event => {
      event.preventDefault();
      mensaje.textContent = 'Comprobando...';
      const controlador = new AbortController();
      const temporizador = setTimeout(() => controlador.abort(), 30000);
      try {
        const respuesta = await fetch('/login', { method: 'POST', cache: 'no-store', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ usuario: usuario.value, password: password.value }), signal: controlador.signal });
        const resultado = await respuesta.json();
        if (!respuesta.ok) { mensaje.textContent = resultado.detail || 'No se pudo iniciar sesión.'; return; }
        if (recordar.checked) {
          localStorage.setItem('alucarpin_credenciales', JSON.stringify({ usuario: usuario.value, password: password.value }));
        } else {
          localStorage.removeItem('alucarpin_credenciales');
        }
        localStorage.setItem('alucarpin_token', resultado.token);
        location.href = resultado.rol === 'administrador' ? '/app/inicio.html' : `/app/ayudante.html?ayudante_id=${resultado.ayudante_id}`;
      } catch (error) {
        mensaje.textContent = error.name === 'AbortError'
          ? 'El servidor tarda demasiado en responder. Inténtalo de nuevo.'
          : 'No se pudo conectar con el servidor.';
      } finally {
        clearTimeout(temporizador);
      }
    });
  </script>
  <script src="/app/pwa.js"></script>
</body>
</html>
