<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b70">
  <link rel="manifest" href="/app/manifest.json">
  <link rel="icon" href="/app/icon.svg" type="image/svg+xml">
  <title>AlucarpinSamitier | Ayudante</title>
  <style>
    :root {
      --bg: #edf3f2;
      --surface: #ffffff;
      --text: #1d2d34;
      --muted: #52686d;
      --brand: #114e55;
      --brand-strong: #0d3d42;
      --accent: #f28b42;
      --accent-deep: #d7602e;
      --soft: #edf8f7;
      --success: #1f6c4d;
      --error: #9c2c2c;
      --border: rgba(17, 78, 85, 0.14);
      --shadow: rgba(17, 78, 85, 0.12);
      color-scheme: light;
      font-family: Segoe UI, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #f3f6f5 0%, #edf4f2 100%);
      color: var(--text);
    }
    main { width: min(760px, calc(100% - 20px)); margin: auto; padding: 24px 12px 40px; }
    header {
      background: linear-gradient(135deg, #18393e 0%, #1d5e62 100%);
      color: white;
      padding: 26px 22px;
      border-radius: 18px;
      margin-bottom: 18px;
      box-shadow: 0 16px 22px rgba(17, 78, 85, 0.18);
    }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 6vw, 34px); }
    p { margin: 0; }
    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-top: 16px;
      box-shadow: 0 10px 24px var(--shadow);
    }
    h2 { margin: 0 0 14px; font-size: 20px; }
    label { display: block; font-weight: 700; margin: 12px 0 6px; }
    input, select, button { width: 100%; min-height: 48px; border-radius: 12px; font: inherit; }
    input, select {
      border: 1px solid rgba(17, 78, 85, 0.18);
      padding: 10px 12px;
      background: rgba(255,255,255,0.96);
    }
    button {
      border: 0;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
      color: white;
      font-weight: 800;
      padding: 10px 14px;
      cursor: pointer;
      margin-top: 16px;
      box-shadow: 0 12px 18px rgba(242, 139, 66, 0.18);
    }
    button:hover { filter: brightness(1.02); }
    .mensaje { min-height: 24px; margin-top: 12px; font-weight: 700; }
    .error { color: var(--error); }
    .ok { color: var(--success); }
    .lista { overflow-x: auto; }
    table { width: 100%; min-width: 650px; border-collapse: collapse; }
    th, td { padding: 11px 8px; border-bottom: 1px solid var(--border); text-align: left; }
    th { background: #edf8f8; }
    tbody tr { cursor: pointer; }
    tbody tr.pagado { background: #e7f4ec; color: #185c2b; }
    tbody tr.pendiente { background: #fdf0f0; color: #7a2020; }
    tbody tr:hover, tbody tr.seleccionado { background: #eef8f7; }
    @media (min-width: 640px) { form { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; } form button, form .mensaje { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Mis días trabajados</h1>
      <p id="nombre">Cargando ayudante...</p>
    </header>
    <section>
      <h2>Registrar día</h2>
      <form id="formulario">
        <div><label for="fecha">Día</label><input id="fecha" type="date" required></div>
        <div><label for="tipo-destino">Destino del día trabajado</label><select id="tipo-destino" required><option value="pendiente">Pendiente de vincular</option><option value="faena">Faena a 3º</option><option value="presupuesto">Presupuesto Alucarpin</option><option value="reparacion">Reparación</option></select></div>
        <div id="presupuesto-bloque" hidden><label for="presupuesto">Presupuesto existente</label><select id="presupuesto"><option value="">Selecciona un presupuesto</option></select></div>
        <div><label for="cliente">Cliente</label><input id="cliente" required maxlength="160"></div>
        <div><label for="obra">Obra</label><input id="obra" required maxlength="160"></div>
        <div><label for="ubicacion">Ubicación</label><input id="ubicacion" maxlength="200"></div>
        <div><label for="poblacion">Población</label><input id="poblacion" maxlength="100"></div>
        <button type="submit">Guardar día y añadir otro</button>
        <div id="mensaje" class="mensaje" role="status"></div>
      </form>
    </section>
    <section>
      <h2>Listado general de mis faenas</h2>
      <p id="contador">Cargando faenas...</p>
      <div class="lista">
        <table><thead><tr><th>Día</th><th>Tipo</th><th>Cliente</th><th>Obra</th><th>Ubicación</th><th>Población</th></tr></thead><tbody id="historial"><tr><td colspan="6">Cargando...</td></tr></tbody></table>
      </div>
    </section>
  </main>
  <script>
    const api = '';
    const token = localStorage.getItem('alucarpin_token');
    if (!token) location.replace('/app/login.html');
    const apiFetch = (url, options = {}) => fetch(url, { ...options, headers: { ...(options.headers || {}), Authorization: `Bearer ${token}` } });
    const mostrarFecha = fecha => { const partes = String(fecha || '').split('-'); return partes.length === 3 ? `${partes[2]}/${partes[1]}/${partes[0]}` : fecha; };
    const ayudanteId = new URLSearchParams(location.search).get('ayudante_id');
    const historial = document.querySelector('#historial');
    const mensaje = document.querySelector('#mensaje');
    const formulario = document.querySelector('#formulario');
    const fecha = document.querySelector('#fecha');
    const tipoDestino = document.querySelector('#tipo-destino');
    const presupuesto = document.querySelector('#presupuesto');
    const presupuestoBloque = document.querySelector('#presupuesto-bloque');
    const contador = document.querySelector('#contador');
    let fichajes = [];

    if (!ayudanteId) {
      mensaje.textContent = 'Falta identificar al ayudante en esta prueba.';
      mensaje.className = 'mensaje error';
      formulario.querySelector('button').disabled = true;
    }
    fecha.valueAsDate = new Date();

    tipoDestino.addEventListener('change', () => {
      presupuestoBloque.hidden = tipoDestino.value !== 'presupuesto';
    });

    async function cargarPresupuestos() {
      const respuesta = await apiFetch('/presupuestos');
      if (!respuesta.ok) return;
      const lista = await respuesta.json();
      presupuesto.innerHTML = '<option value="">Crear presupuesto provisional</option>';
      lista.forEach(item => {
        const opcion = document.createElement('option');
        opcion.value = item.num_presupuesto;
        opcion.textContent = `Nº ${item.num_presupuesto} | ${item.cliente} | ${item.estado || ''}`;
        presupuesto.appendChild(opcion);
      });
    }

    async function cargar() {
      if (!ayudanteId) return;
      const [ayudantes, respuesta] = await Promise.all([
        apiFetch(`${api}/ayudantes`),
        apiFetch(`${api}/ayudantes/${ayudanteId}/fichajes`)
      ]);
      const listaAyudantes = await ayudantes.json();
      const ayudante = listaAyudantes.find(item => String(item.id) === String(ayudanteId));
      document.querySelector('#nombre').textContent = ayudante ? ayudante.nombre : 'Ayudante no encontrado';
      fichajes = await respuesta.json();
      pintar();
    }

    function pintar() {
      historial.textContent = '';
      contador.textContent = `${fichajes.length} día${fichajes.length === 1 ? '' : 's'} registrado${fichajes.length === 1 ? '' : 's'}`;
      if (!fichajes.length) { historial.innerHTML = '<tr><td colspan="6">Todavía no hay días registrados.</td></tr>'; return; }
      fichajes.forEach(fichaje => {
        const item = document.createElement('tr');
        item.className = `registro ${fichaje.pagado ? 'pagado' : 'pendiente'}`;
        const tipo = fichaje.tipo_destino === 'presupuesto' ? 'Presupuesto Alucarpin' : fichaje.tipo_destino === 'reparacion' ? 'Reparación' : fichaje.tipo_destino === 'faena' ? 'Faena a 3º' : 'Pendiente de vincular';
        item.innerHTML = `<td>${mostrarFecha(fichaje.fecha)}</td><td>${tipo}</td><td>${fichaje.cliente || ''}</td><td>${fichaje.obra}</td><td>${fichaje.ubicacion || ''}</td><td>${fichaje.poblacion || ''}</td>`;
        item.onclick = () => cargarEnFormulario(fichaje, item);
        historial.appendChild(item);
      });
    }

    function cargarEnFormulario(fichaje, elemento) {
      document.querySelectorAll('#historial .registro').forEach(item => item.classList.remove('seleccionado'));
      elemento.classList.add('seleccionado');
      fecha.value = fichaje.fecha;
      tipoDestino.value = fichaje.tipo_destino || 'pendiente';
      presupuesto.value = fichaje.num_presupuesto || '';
      tipoDestino.dispatchEvent(new Event('change'));
      document.querySelector('#cliente').value = fichaje.cliente || '';
      document.querySelector('#obra').value = fichaje.obra;
      document.querySelector('#ubicacion').value = fichaje.ubicacion || '';
      document.querySelector('#poblacion').value = fichaje.poblacion || '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      formulario.dataset.id = fichaje.id;
    }

    formulario.addEventListener('submit', async event => {
      event.preventDefault();
      if (!fecha.value) {
        mensaje.textContent = 'Indica el día trabajado antes de guardar.';
        mensaje.className = 'mensaje error';
        fecha.focus();
        return;
      }
      mensaje.textContent = 'Guardando...';
      mensaje.className = 'mensaje';
      const datos = { ayudante_id: Number(ayudanteId), fecha: fecha.value, tipo_destino: tipoDestino.value, cliente: document.querySelector('#cliente').value, obra: document.querySelector('#obra').value, ubicacion: document.querySelector('#ubicacion').value, poblacion: document.querySelector('#poblacion').value, num_presupuesto: tipoDestino.value === 'presupuesto' ? (presupuesto.value || null) : null };
      const fechaGuardada = fecha.value;
      const id = formulario.dataset.id;
      const respuesta = await apiFetch(id ? `${api}/fichajes/${id}` : `${api}/fichajes`, { method: id ? 'PATCH' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) });
      if (!respuesta.ok) { const detalle = await respuesta.json(); mensaje.textContent = detalle.detail || 'No se pudo guardar.'; mensaje.className = 'mensaje error'; return; }
      const resultado = await respuesta.json();
      mensaje.textContent = resultado.estado_revision === 'Pendiente de revisar'
        ? 'Día guardado pendiente de vincular. Puedes añadir otro del mismo día.'
        : 'Día guardado y vinculado correctamente.';
      mensaje.className = 'mensaje ok';
      delete formulario.dataset.id;
      formulario.reset();
      fecha.value = fechaGuardada;
      tipoDestino.value = 'pendiente';
      tipoDestino.dispatchEvent(new Event('change'));
      await cargar();
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) cargar().catch(() => {});
    });
    setInterval(() => {
      if (!document.hidden) cargar().catch(() => {});
    }, 15000);

    cargar().catch(() => { historial.textContent = 'No se pudo conectar con el programa.'; });
    cargarPresupuestos().catch(() => {});
  </script>
  <script src="/app/pwa.js"></script>
</body>
</html>
