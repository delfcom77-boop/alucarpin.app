<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AlucarpinSamitier | Agenda</title>
  <style>
    :root { font-family: Segoe UI, sans-serif; color: #223238; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f1eb; }
    main { width: min(1000px, 100%); margin: auto; padding: 24px 16px 40px; }
    header { background: #293f4a; color: #fff; border-radius: 14px; padding: 22px; }
    h1, h2 { margin: 0 0 10px; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
    nav a { background: #d45d3f; color: #fff; border-radius: 8px; padding: 12px 16px; text-decoration: none; font-weight: 700; }
    section { background: #fff; border: 1px solid #ddd8cc; border-radius: 12px; padding: 18px; margin-top: 16px; }
    form { display: grid; gap: 12px; }
    label { font-weight: 700; display: grid; gap: 6px; }
    input, select, button { min-height: 46px; border-radius: 8px; font: inherit; }
    input, select { border: 1px solid #b9c4c2; padding: 10px; }
    button { background: #d45d3f; color: #fff; border: 0; font-weight: 700; cursor: pointer; padding: 10px 14px; }
    .fila { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .mensaje { min-height: 24px; font-weight: 700; }
    .error { color: #a52e2e; }
    .exito { color: #1c6b42; }
    .lista { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th, td { border-bottom: 1px solid #ddd8cc; padding: 10px 8px; text-align: left; }
    th { background: #eef3f1; }
    .acciones { display: flex; flex-wrap: wrap; gap: 8px; }
    .acciones button { min-height: 38px; padding: 7px 12px; }
    .borrar { background: #f4cccc; color: #7b2020; }
    .seguimiento { background: #fff8e5; border-color: #e6c968; }
      .agenda-menu { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
      .agenda-menu button { background: #d45d3f; color: #fff; border: 0; padding: 16px 24px; min-width: 180px; cursor: pointer; font-size: 17px; font-weight: 700; }
      .agenda-menu button.seleccionado { background: #293f4a; }
    @media (max-width: 560px) { .fila { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Agenda y citas</h1><p>Visitas, reuniones, llamadas y reparaciones pendientes</p></header>
    <nav><a href="/app/inicio.html">Volver al menú</a></nav>
    <button id="sincronizar-calendario" type="button">Sincronizar todo con el calendario</button>
      <div class="agenda-menu" aria-label="Secciones de agenda">
        <button type="button" class="seleccionado" data-seccion-agenda="citas">NUEVA CITA</button>
        <button type="button" data-seccion-agenda="notas">NUEVA NOTA</button>
      </div>
    <h2 id="titulo-seccion">NUEVA CITA</h2>
    <section data-seccion-contenido="citas">
      <form id="formulario">
        <div class="fila"><label>Fecha de la cita <input id="fecha" type="date" required></label><label>Hora de la cita / visita <input id="hora" type="time" required></label></div>
        <div><label>Tipo <select id="tipo"><option value="visita">Visita para valorar</option><option value="faena">Faena</option><option value="presupuesto">Presupuesto</option><option value="reparacion">Reparación</option><option value="tomar_medidas">Tomar medidas</option><option value="reunion">Reunión</option><option value="llamada">Llamada</option><option value="otro">Otro</option></select></label></div>
        <div class="fila"><label>Cliente <input id="cliente"></label><label>Teléfono <input id="telefono" type="tel"></label></div>
        <div class="fila"><label>Dirección <input id="ubicacion"></label><label>Población <input id="poblacion"></label></div>
        <label>Qué tengo que hacer <input id="observaciones" placeholder="Valorar reparación, reunión, revisar medidas..."></label>
        <button id="guardar-cita" type="submit">Guardar y añadir al calendario</button><button id="cancelar-edicion-cita" type="button" hidden>Cancelar modificación</button><div id="mensaje" class="mensaje"></div>
      </form>
    </section>
    <section class="seguimiento" data-seccion-contenido="notas" hidden>
      <h2>NUEVA NOTA</h2>
      <form id="formulario-seguimiento">
        <div><label>Me llamó el día <input id="seguimiento-fecha-llamada" type="date" required></label></div>
        <div><label>Hora del recordatorio diario <input id="seguimiento-hora" type="time" required></label></div>
        <div class="fila"><label>Cliente <input id="seguimiento-cliente"></label><label>Teléfono <input id="seguimiento-telefono" type="tel"></label></div>
        <div class="fila"><label>Dirección <input id="seguimiento-ubicacion"></label><label>Población <input id="seguimiento-poblacion"></label></div>
        <label>Qué me ha pedido <input id="seguimiento-motivo" required placeholder="Tomarle medidas"></label>
        <label>Qué le he dicho <input id="seguimiento-observaciones" placeholder="Tengo que mirar cuándo puedo ir y llamarle"></label>
        <button id="guardar-nota" type="submit">Guardar nota y añadir recordatorio diario</button><button id="cancelar-edicion-nota" type="button" hidden>Cancelar modificación</button><div id="mensaje-seguimiento" class="mensaje"></div>
      </form>
    </section>
    <section data-seccion-contenido="notas" hidden><h2>Notas pendientes</h2><input id="buscar-notas" placeholder="Buscar notas por cliente, teléfono, dirección o texto"><div class="lista"><table><thead><tr><th>Recordatorio</th><th>Cliente</th><th>Dirección / población</th><th>Qué me ha pedido</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="lista-seguimientos"><tr><td colspan="6">Cargando...</td></tr></tbody></table></div></section>
    <section data-seccion-contenido="citas"><h2>Próximas citas</h2><input id="buscar-citas" placeholder="Buscar citas por cliente, teléfono, dirección o población"><div class="lista"><table><thead><tr><th>Fecha</th><th>Hora</th><th>Tipo</th><th>Cliente</th><th>Dirección</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="lista"><tr><td colspan="7">Cargando...</td></tr></tbody></table></div></section>
  </main>
  <script>
    const token = localStorage.getItem('alucarpin_token');
    if (!token) location.replace('/app/login.html');
    const apiFetch = (url, options = {}) => fetch(url, { ...options, headers: { ...(options.headers || {}), Authorization: `Bearer ${token}` } });
    const formulario = document.querySelector('#formulario');
    const mensaje = document.querySelector('#mensaje');
    const formularioSeguimiento = document.querySelector('#formulario-seguimiento');
    const mensajeSeguimiento = document.querySelector('#mensaje-seguimiento');
    const aplicarBusqueda = (selector, tablaSelector) => document.querySelector(selector).addEventListener('input', event => { const texto = event.target.value.trim().toLowerCase(); document.querySelectorAll(`${tablaSelector} tr`).forEach(fila => { fila.hidden = Boolean(texto) && !fila.textContent.toLowerCase().includes(texto); }); });
    aplicarBusqueda('#buscar-citas', '#lista');
    aplicarBusqueda('#buscar-notas', '#lista-seguimientos');
    document.querySelectorAll('[data-seccion-agenda]').forEach(boton => boton.onclick = () => {
      const seccion = boton.dataset.seccionAgenda;
      document.querySelectorAll('[data-seccion-contenido]').forEach(elemento => { elemento.hidden = elemento.dataset.seccionContenido !== seccion; });
      document.querySelectorAll('[data-seccion-agenda]').forEach(elemento => elemento.classList.toggle('seleccionado', elemento === boton));
      document.querySelector('#titulo-seccion').textContent = seccion === 'notas' ? 'NUEVA NOTA' : 'NUEVA CITA';
    });
    const tipos = { visita: 'Visita para valorar', faena: 'Faena', presupuesto: 'Presupuesto', reparacion: 'Reparación', tomar_medidas: 'Tomar medidas', reunion: 'Reunión', llamada: 'Llamada', otro: 'Otro' };
    const fechaTexto = valor => String(valor || '').split('-').reverse().join('/');
    const valor = id => document.querySelector(`#${id}`).value;
    const sincronizarCalendario = async () => { const respuesta = await apiFetch('/calendario.ics'); if (!respuesta.ok) throw new Error('No se pudo sincronizar el calendario.'); const enlace = document.createElement('a'); enlace.href = URL.createObjectURL(await respuesta.blob()); enlace.download = 'alucarpin-calendario-completo.ics'; enlace.click(); URL.revokeObjectURL(enlace.href); };
    document.querySelector('#sincronizar-calendario').onclick = () => sincronizarCalendario().then(() => { mensaje.textContent = 'Calendario sincronizado con todas tus citas, trabajos y recordatorios.'; mensaje.className = 'mensaje exito'; }).catch(error => mostrarError(error.message));
    document.querySelector('#fecha').valueAsDate = new Date();
    document.querySelector('#hora').value = '09:00';
    document.querySelector('#seguimiento-fecha-llamada').valueAsDate = new Date();
    document.querySelector('#seguimiento-hora').value = '10:00';
    async function calendario(id) { const respuesta = await apiFetch(`/citas/${id}/calendario`); if (!respuesta.ok) throw new Error('No se pudo generar el calendario.'); const enlace = document.createElement('a'); enlace.href = URL.createObjectURL(await respuesta.blob()); enlace.download = `alucarpin-cita-${id}.ics`; enlace.click(); URL.revokeObjectURL(enlace.href); }
    async function cargar() {
      const respuesta = await apiFetch('/citas'); if (!respuesta.ok) throw new Error('No se pudieron cargar las citas.');
      const citas = await respuesta.json(); const cuerpo = document.querySelector('#lista'); cuerpo.textContent = '';
      if (!citas.length) { cuerpo.innerHTML = '<tr><td colspan="7">No hay citas agendadas.</td></tr>'; return; }
      citas.forEach(cita => { const fila = document.createElement('tr'); fila.innerHTML = `<td>${fechaTexto(cita.fecha)}</td><td>${cita.hora}</td><td>${tipos[cita.tipo] || cita.tipo}</td><td>${cita.cliente || '-'}</td><td>${[cita.ubicacion, cita.poblacion].filter(Boolean).join(', ') || '-'}</td><td>${cita.estado}</td><td class="acciones"><button type="button" class="editar-cita">Modificar</button><button type="button" class="cal">Calendario</button><button type="button" class="realizada" ${cita.estado === 'Realizada' ? 'disabled' : ''}>${cita.estado === 'Realizada' ? 'Realizada' : 'Marcar realizada'}</button><button type="button" class="borrar">Borrar</button></td>`; fila.querySelector('.editar-cita').onclick = () => editarCita(cita); fila.querySelector('.cal').onclick = () => calendario(cita.id).catch(error => mostrarError(error.message)); fila.querySelector('.realizada').onclick = async () => { const respuesta = await apiFetch(`/citas/${cita.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fecha: cita.fecha, hora: cita.hora, tipo: cita.tipo, cliente: cita.cliente || '', ubicacion: cita.ubicacion || '', poblacion: cita.poblacion || '', telefono: cita.telefono || '', observaciones: cita.observaciones || '', estado: 'Realizada' }) }); if (!respuesta.ok) { const resultado = await respuesta.json().catch(() => ({})); mostrarError(resultado.detail || 'No se pudo marcar la cita como realizada.'); return; } mensaje.textContent = 'Cita marcada como realizada.'; mensaje.className = 'mensaje exito'; await cargar(); }; fila.querySelector('.borrar').onclick = async () => { if (!confirm('¿Borrar esta cita?')) return; await apiFetch(`/citas/${cita.id}`, { method: 'DELETE' }); await cargar(); }; cuerpo.appendChild(fila); });
    }
    const mostrarError = texto => { mensaje.textContent = texto; mensaje.className = 'mensaje error'; };
    const mostrarErrorSeguimiento = texto => { mensajeSeguimiento.textContent = texto; mensajeSeguimiento.className = 'mensaje error'; };
    async function calendarioSeguimiento(id) { const respuesta = await apiFetch(`/seguimientos/${id}/calendario`); if (!respuesta.ok) throw new Error('No se pudo generar la alarma.'); const enlace = document.createElement('a'); enlace.href = URL.createObjectURL(await respuesta.blob()); enlace.download = `alucarpin-seguimiento-${id}.ics`; enlace.click(); URL.revokeObjectURL(enlace.href); }
    async function cargarSeguimientos() {
      const respuesta = await apiFetch('/seguimientos'); if (!respuesta.ok) throw new Error('No se pudieron cargar las llamadas pendientes.');
      const seguimientos = await respuesta.json(); const cuerpo = document.querySelector('#lista-seguimientos'); cuerpo.textContent = '';
      if (!seguimientos.length) { cuerpo.innerHTML = '<tr><td colspan="6">No hay llamadas pendientes.</td></tr>'; return; }
      seguimientos.forEach(seguimiento => { const fila = document.createElement('tr'); fila.innerHTML = `<td>Llamada: ${fechaTexto(seguimiento.fecha_llamada)}<br>Recordatorio diario: ${seguimiento.hora}</td><td>${seguimiento.cliente || '-'}</td><td>${seguimiento.ubicacion || '-'}${seguimiento.poblacion ? `, ${seguimiento.poblacion}` : ''}</td><td>${seguimiento.motivo}</td><td>${seguimiento.estado}</td><td class="acciones"><button type="button" class="editar-nota">Modificar</button><button type="button" class="crear-cita-seguimiento">Crear cita</button><button type="button" class="cal-seguimiento">Alarma</button><button type="button" class="realizado-seguimiento">Marcar realizada</button><button type="button" class="borrar-seguimiento borrar">Borrar</button></td>`; fila.querySelector('.editar-nota').onclick = () => editarNota(seguimiento); fila.querySelector('.crear-cita-seguimiento').onclick = () => prepararCitaDesdeSeguimiento(seguimiento); fila.querySelector('.cal-seguimiento').onclick = () => calendarioSeguimiento(seguimiento.id).catch(error => mostrarErrorSeguimiento(error.message)); fila.querySelector('.realizado-seguimiento').onclick = async () => { await apiFetch(`/seguimientos/${seguimiento.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...seguimiento, fecha_recordatorio: seguimiento.fecha_recordatorio, fecha_llamada: seguimiento.fecha_llamada }) }); await cargarSeguimientos(); }; fila.querySelector('.borrar-seguimiento').onclick = async () => { if (!confirm('¿Borrar este recordatorio?')) return; await apiFetch(`/seguimientos/${seguimiento.id}`, { method: 'DELETE' }); await cargarSeguimientos(); }; cuerpo.appendChild(fila); });
    }
    function editarCita(cita) { formulario.dataset.id = cita.id; document.querySelector('#fecha').value = cita.fecha; document.querySelector('#hora').value = cita.hora; document.querySelector('#tipo').value = cita.tipo; document.querySelector('#cliente').value = cita.cliente || ''; document.querySelector('#telefono').value = cita.telefono || ''; document.querySelector('#ubicacion').value = cita.ubicacion || ''; document.querySelector('#poblacion').value = cita.poblacion || ''; document.querySelector('#observaciones').value = cita.observaciones || ''; document.querySelector('#guardar-cita').textContent = 'Actualizar cita'; document.querySelector('#cancelar-edicion-cita').hidden = false; document.querySelector('[data-seccion-agenda="citas"]').click(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    function editarNota(nota) { formularioSeguimiento.dataset.id = nota.id; document.querySelector('#seguimiento-fecha-llamada').value = nota.fecha_llamada || ''; document.querySelector('#seguimiento-hora').value = nota.hora || '10:00'; document.querySelector('#seguimiento-cliente').value = nota.cliente || ''; document.querySelector('#seguimiento-telefono').value = nota.telefono || ''; document.querySelector('#seguimiento-ubicacion').value = nota.ubicacion || ''; document.querySelector('#seguimiento-poblacion').value = nota.poblacion || ''; document.querySelector('#seguimiento-motivo').value = nota.motivo || ''; document.querySelector('#seguimiento-observaciones').value = nota.observaciones || ''; document.querySelector('#guardar-nota').textContent = 'Actualizar nota'; document.querySelector('#cancelar-edicion-nota').hidden = false; document.querySelector('[data-seccion-agenda="notas"]').click(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    const limpiarEdicionCita = () => { delete formulario.dataset.id; document.querySelector('#guardar-cita').textContent = 'Guardar y añadir al calendario'; document.querySelector('#cancelar-edicion-cita').hidden = true; formulario.reset(); document.querySelector('#fecha').valueAsDate = new Date(); document.querySelector('#hora').value = '09:00'; };
    const limpiarEdicionNota = () => { delete formularioSeguimiento.dataset.id; document.querySelector('#guardar-nota').textContent = 'Guardar nota y añadir recordatorio diario'; document.querySelector('#cancelar-edicion-nota').hidden = true; formularioSeguimiento.reset(); document.querySelector('#seguimiento-fecha-llamada').valueAsDate = new Date(); document.querySelector('#seguimiento-hora').value = '10:00'; };
    document.querySelector('#cancelar-edicion-cita').onclick = limpiarEdicionCita;
    document.querySelector('#cancelar-edicion-nota').onclick = limpiarEdicionNota;
    function prepararCitaDesdeSeguimiento(seguimiento) { formulario.dataset.seguimientoId = seguimiento.id; document.querySelector('#cliente').value = seguimiento.cliente || ''; document.querySelector('#telefono').value = seguimiento.telefono || ''; document.querySelector('#ubicacion').value = seguimiento.ubicacion || ''; document.querySelector('#poblacion').value = seguimiento.poblacion || ''; document.querySelector('#observaciones').value = seguimiento.motivo || ''; document.querySelector('#tipo').value = 'visita'; document.querySelector('#fecha').valueAsDate = new Date(); document.querySelector('#hora').value = '09:00'; document.querySelector('#fecha').scrollIntoView({ behavior: 'smooth', block: 'center' }); mensaje.textContent = 'Datos copiados. Completa el día y la hora de la cita y guárdala.'; mensaje.className = 'mensaje exito'; }
    formularioSeguimiento.onsubmit = async event => { event.preventDefault(); const datos = { fecha_llamada: valor('seguimiento-fecha-llamada'), hora: valor('seguimiento-hora'), cliente: valor('seguimiento-cliente'), telefono: valor('seguimiento-telefono'), ubicacion: valor('seguimiento-ubicacion'), poblacion: valor('seguimiento-poblacion'), motivo: valor('seguimiento-motivo'), observaciones: valor('seguimiento-observaciones'), estado: 'Pendiente' }; const idNota = formularioSeguimiento.dataset.id; const respuesta = await apiFetch(idNota ? `/seguimientos/${idNota}` : '/seguimientos', { method: idNota ? 'PATCH' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) }); const resultado = await respuesta.json(); if (!respuesta.ok) { mostrarErrorSeguimiento(resultado.detail || 'No se pudo guardar la nota.'); return; } if (!idNota) await calendarioSeguimiento(resultado.id); mensajeSeguimiento.textContent = idNota ? 'Nota actualizada.' : 'Nota guardada con recordatorio diario.'; mensajeSeguimiento.className = 'mensaje exito'; limpiarEdicionNota(); await cargarSeguimientos(); };
    formulario.onsubmit = async event => { event.preventDefault(); const datos = { fecha: valor('fecha'), hora: valor('hora'), tipo: valor('tipo'), cliente: valor('cliente'), ubicacion: valor('ubicacion'), poblacion: valor('poblacion'), telefono: valor('telefono'), observaciones: valor('observaciones'), estado: 'Pendiente' }; const idCita = formulario.dataset.id; const respuesta = await apiFetch(idCita ? `/citas/${idCita}` : '/citas', { method: idCita ? 'PATCH' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) }); const resultado = await respuesta.json(); if (!respuesta.ok) { mostrarError(resultado.detail || 'No se pudo guardar la cita.'); return; } const citaId = idCita || resultado.id; if (!idCita) await calendario(citaId); const seguimientoId = formulario.dataset.seguimientoId; if (seguimientoId) { const nota = await apiFetch(`/seguimientos/${seguimientoId}`); if (nota.ok) { const notaDatos = await nota.json(); await apiFetch(`/seguimientos/${seguimientoId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...notaDatos, estado: 'Realizado', fecha_recordatorio: notaDatos.fecha_recordatorio, fecha_llamada: notaDatos.fecha_llamada }) }); } delete formulario.dataset.seguimientoId; await cargarSeguimientos(); } mensaje.textContent = idCita ? 'Cita actualizada.' : 'Cita guardada y añadida al calendario.'; mensaje.className = 'mensaje exito'; limpiarEdicionCita(); await cargar(); };
    cargar().catch(error => { document.querySelector('#lista').innerHTML = `<tr><td colspan="7">${error.message}</td></tr>`; mostrarError(error.message); });
    cargarSeguimientos().catch(error => { document.querySelector('#lista-seguimientos').innerHTML = `<tr><td colspan="6">${error.message}</td></tr>`; mostrarErrorSeguimiento(error.message); });
  </script>
</body>
</html>
