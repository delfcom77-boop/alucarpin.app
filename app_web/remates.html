<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#293f4a">
  <link rel="manifest" href="/app/manifest.json">
  <title>AlucarpinSamitier | Remates</title>
  <style>
    :root { font-family: Segoe UI, sans-serif; color: #223238; }
    * { box-sizing: border-box; }
    body { margin: 0; background: linear-gradient(180deg, #f5f7f4 0%, #edf2f1 100%); }
    main { width: min(980px, calc(100% - 24px)); margin: auto; padding: 24px 12px 40px; }
    header { background: linear-gradient(135deg, #293f4a 0%, #536f72 100%); color: #fff; border-radius: 18px; padding: 24px 22px; box-shadow: 0 16px 24px rgba(14, 41, 45, 0.18); }
    h1, h2 { margin: 0 0 10px; }
    header p { margin: 0; opacity: .9; }
    nav { margin: 16px 0; }
    nav a { display: inline-block; background: #293f4a; color: #fff; border-radius: 10px; padding: 11px 15px; text-decoration: none; font-weight: 700; }
    section { background: #fff; border: 1px solid #d9e0dd; border-radius: 14px; padding: 18px; margin-top: 16px; box-shadow: 0 10px 22px rgba(14, 41, 45, .1); }
    form { display: grid; gap: 12px; }
    label { display: grid; gap: 6px; font-weight: 700; }
    input, select, button { min-height: 46px; border-radius: 9px; font: inherit; }
    input, select { border: 1px solid #b9c4c2; padding: 10px; background: #fff; }
    button { border: 0; padding: 10px 14px; background: #d45d3f; color: #fff; font-weight: 700; cursor: pointer; }
    .fila { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .medidas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 14px; background: #eef5f2; border-radius: 10px; }
    .ayuda { margin: 0; color: #506269; font-size: .95rem; }
    .lista { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 820px; }
    th, td { border-bottom: 1px solid #d9e0dd; padding: 10px 8px; text-align: left; }
    th { background: #eef3f1; }
    .borrar { background: #f4cccc; color: #7b2020; }
    .mensaje { min-height: 24px; font-weight: 700; }
    .error { color: #a52e2e; }
    .exito { color: #1c6b42; }
    @media (max-width: 650px) { .fila, .medidas { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Remates</h1><p>Define chapas, angulos y bandejas/U para cada faena.</p></header>
    <nav><a href="/app/inicio.html">Volver al menu</a></nav>
    <section>
      <h2>Nuevo remate</h2>
      <form id="formulario">
        <div class="fila">
          <label>Tipo de faena <select id="origen"><option value="propia">Faena propia</option><option value="tercero">Faena de 3º</option></select></label>
          <label>Faena <select id="origen-id" required><option value="">Cargando faenas...</option></select></label>
        </div>
        <label>Remate <select id="tipo"><option value="u">Bandeja / U</option><option value="chapa">Chapa</option><option value="angulo">Angulo / L</option></select></label>
        <p id="ayuda-medidas" class="ayuda">Para una U: alto 1 x ancho x alto 2 x largura. Todas las medidas estan en milimetros.</p>
        <div class="medidas">
          <label id="etiqueta-1">Alto 1 (mm)<input id="medida-1" type="number" min="0" step="1" required></label>
          <label id="etiqueta-2">Ancho (mm)<input id="medida-2" type="number" min="0" step="1" required></label>
          <label id="etiqueta-3">Alto 2 (mm)<input id="medida-3" type="number" min="0" step="1" required></label>
          <label>Largura (mm)<input id="largura" type="number" min="1" step="1" required></label>
        </div>
        <div class="fila">
          <label>Cantidad<input id="cantidad" type="number" min="1" step="1" value="1" required></label>
          <label>Observaciones<input id="observaciones" placeholder="Pliegues, color, entrega..." ></label>
        </div>
        <button type="submit">Guardar remate</button>
        <div id="mensaje" class="mensaje"></div>
      </form>
    </section>
    <section>
      <h2>Remates guardados</h2>
      <div class="lista"><table><thead><tr><th>Faena</th><th>Tipo</th><th>Medidas</th><th>Largura</th><th>Cantidad</th><th>Observaciones</th><th></th></tr></thead><tbody id="lista"><tr><td colspan="7">Selecciona una faena.</td></tr></tbody></table></div>
    </section>
  </main>
  <script>
    const token = localStorage.getItem('alucarpin_token');
    if (!token) location.replace('/app/login.html');
    const apiFetch = (url, options = {}) => fetch(url, { ...options, headers: { ...(options.headers || {}), Authorization: `Bearer ${token}` } });
    const nombres = { u: 'Bandeja / U', chapa: 'Chapa', angulo: 'Angulo / L' };
    const origen = document.querySelector('#origen');
    const origenId = document.querySelector('#origen-id');
    const tipo = document.querySelector('#tipo');
    const lista = document.querySelector('#lista');
    const mensaje = document.querySelector('#mensaje');
    let faenas = [];
    let propias = [];
    const datos = id => document.querySelector(`#${id}`).value;
    const dinero = valor => Number(valor || 0).toLocaleString('es-ES', { maximumFractionDigits: 2 });
    function mostrarError(texto) { mensaje.textContent = texto; mensaje.className = 'mensaje error'; }
    function actualizarEtiquetas() {
      const etiquetas = tipo.value === 'u' ? ['Alto 1 (mm)', 'Ancho (mm)', 'Alto 2 (mm)'] : tipo.value === 'angulo' ? ['Ala 1 (mm)', 'Ala 2 (mm)', 'Espesor (mm)'] : ['Ancho (mm)', 'Espesor (mm)', 'Desarrollo (mm)'];
      ['etiqueta-1', 'etiqueta-2', 'etiqueta-3'].forEach((id, indice) => { document.querySelector(`#${id}`).firstChild.textContent = etiquetas[indice]; });
      document.querySelector('#ayuda-medidas').textContent = tipo.value === 'u' ? 'Para una U: alto 1 x ancho x alto 2 x largura. Todas las medidas estan en milimetros.' : tipo.value === 'angulo' ? 'Para una L: ala 1 x ala 2 x espesor x largura.' : 'Para una chapa: ancho x espesor x desarrollo x largura.';
    }
    async function cargarFaenas() {
      const [respuestaPropias, respuestaTerceros] = await Promise.all([apiFetch('/trabajos'), apiFetch('/faenas')]);
      if (!respuestaPropias.ok || !respuestaTerceros.ok) throw new Error('No se pudieron cargar las faenas.');
      propias = (await respuestaPropias.json()).filter(item => item.origen === 'propio');
      faenas = await respuestaTerceros.json();
      pintarOpciones();
    }
    function pintarOpciones() {
      const listaOrigen = origen.value === 'propia' ? propias : faenas;
      origenId.innerHTML = '<option value="">Selecciona una faena</option>';
      listaOrigen.forEach(item => { const opcion = document.createElement('option'); opcion.value = item.id; opcion.textContent = `${item.cliente || 'Sin cliente'} - ${item.obra || 'Sin obra'}`; origenId.appendChild(opcion); });
      lista.innerHTML = '<tr><td colspan="7">Selecciona una faena.</td></tr>';
    }
    async function cargarRemates() {
      if (!origenId.value) { lista.innerHTML = '<tr><td colspan="7">Selecciona una faena.</td></tr>'; return; }
      const respuesta = await apiFetch(`/remates?origen=${origen.value}&origen_id=${origenId.value}`);
      if (!respuesta.ok) throw new Error('No se pudieron cargar los remates.');
      const remates = await respuesta.json();
      lista.innerHTML = remates.length ? '' : '<tr><td colspan="7">Todavia no hay remates para esta faena.</td></tr>';
      remates.forEach(remate => { const fila = document.createElement('tr'); fila.innerHTML = `<td>${origen.value === 'propia' ? 'Propia' : '3º'} #${remate.origen_id}</td><td>${nombres[remate.tipo]}</td><td>${dinero(remate.medida_1)} x ${dinero(remate.medida_2)} x ${dinero(remate.medida_3)} mm</td><td>${dinero(remate.largura)} mm</td><td>${remate.cantidad}</td><td>${remate.observaciones || '-'}</td><td><button type="button" class="borrar">Borrar</button></td>`; fila.querySelector('.borrar').onclick = async () => { if (!confirm('¿Borrar este remate?')) return; await apiFetch(`/remates/${remate.id}`, { method: 'DELETE' }); await cargarRemates(); }; lista.appendChild(fila); });
    }
    origen.onchange = () => { pintarOpciones(); cargarRemates().catch(error => mostrarError(error.message)); };
    origenId.onchange = () => cargarRemates().catch(error => mostrarError(error.message));
    tipo.onchange = actualizarEtiquetas;
    document.querySelector('#formulario').onsubmit = async event => { event.preventDefault(); if (!origenId.value) { mostrarError('Selecciona una faena.'); return; } const payload = { origen: origen.value, origen_id: Number(origenId.value), tipo: tipo.value, medida_1: Number(datos('medida-1')), medida_2: Number(datos('medida-2')), medida_3: Number(datos('medida-3')), largura: Number(datos('largura')), cantidad: Number(datos('cantidad')), observaciones: datos('observaciones') }; const respuesta = await apiFetch('/remates', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); const resultado = await respuesta.json(); if (!respuesta.ok) { mostrarError(resultado.detail || 'No se pudo guardar el remate.'); return; } mensaje.textContent = 'Remate guardado.'; mensaje.className = 'mensaje exito'; document.querySelector('#medida-1').value = ''; document.querySelector('#medida-2').value = ''; document.querySelector('#medida-3').value = ''; document.querySelector('#largura').value = ''; document.querySelector('#observaciones').value = ''; await cargarRemates(); };
    actualizarEtiquetas();
    cargarFaenas().catch(error => mostrarError(error.message));
  </script>
</body>
</html>
